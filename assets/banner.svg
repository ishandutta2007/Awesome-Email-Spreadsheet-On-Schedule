<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="1200" height="360">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#141a2e" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="glowLineGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <linearGradient id="glowLineGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <radialGradient id="ambientCyan" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientIndigo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="ambientPurple" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0" />
    </radialGradient>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#primaryTextGrad);
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .pill-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 12px;
        font-weight: 700;
        fill: #cbd5e1;
        letter-spacing: 0.6px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 14px;
        font-weight: 600;
        fill: #f1f5f9;
      }
      .badge-subtext {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 11px;
        font-weight: 400;
        fill: #94a3b8;
      }
      @keyframes pulseOrb {
        0%, 100% { transform: scale(1); opacity: 0.35; }
        50% { transform: scale(1.15); opacity: 0.75; }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-6px); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -48; }
      }
      .orb-1 {
        transform-origin: 240px 285px;
        animation: pulseOrb 4.5s ease-in-out infinite;
      }
      .orb-2 {
        transform-origin: 600px 285px;
        animation: pulseOrb 4.5s ease-in-out 1.5s infinite;
      }
      .orb-3 {
        transform-origin: 960px 285px;
        animation: pulseOrb 4.5s ease-in-out 3s infinite;
      }
      .node-1 {
        transform-origin: 240px 285px;
        animation: floatCard 5s ease-in-out infinite;
      }
      .node-2 {
        transform-origin: 600px 285px;
        animation: floatCard 5.5s ease-in-out 1.2s infinite;
      }
      .node-3 {
        transform-origin: 960px 285px;
        animation: floatCard 5s ease-in-out 2.4s infinite;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 2.5s linear infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Tech Grid Matrix -->
  <g opacity="0.07" stroke="#94a3b8" stroke-width="1">
    <line x1="120" y1="0" x2="120" y2="360" />
    <line x1="280" y1="0" x2="280" y2="360" />
    <line x1="440" y1="0" x2="440" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="760" y1="0" x2="760" y2="360" />
    <line x1="920" y1="0" x2="920" y2="360" />
    <line x1="1080" y1="0" x2="1080" y2="360" />
    <line x1="0" y1="70" x2="1200" y2="70" />
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="280" x2="1200" y2="280" />
  </g>

  <!-- Dynamic Radial Glow Spots behind interactive nodes -->
  <circle cx="240" cy="285" r="110" fill="url(#ambientCyan)" class="orb-1" />
  <circle cx="600" cy="285" r="110" fill="url(#ambientIndigo)" class="orb-2" />
  <circle cx="960" cy="285" r="110" fill="url(#ambientPurple)" class="orb-3" />

  <!-- Animated Pipeline Flow Connectors -->
  <path d="M 340 285 L 490 285" stroke="url(#glowLineGrad1)" stroke-width="3" stroke-linecap="round" class="flow-line" opacity="0.85" />
  <polygon points="498,285 486,280 486,290" fill="#818cf8" opacity="0.9" />

  <path d="M 710 285 L 850 285" stroke="url(#glowLineGrad2)" stroke-width="3" stroke-linecap="round" class="flow-line" opacity="0.85" />
  <polygon points="858,285 846,280 846,290" fill="#c084fc" opacity="0.9" />

  <!-- Pipeline Cards (Lower Section) -->

  <!-- Node 1: Spreadsheets & Data Sources -->
  <g class="node-1">
    <rect x="140" y="248" width="195" height="74" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-width="1.5" stroke-opacity="0.7" />
    <g transform="translate(156, 267)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#0284c7" fill-opacity="0.25" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <!-- Spreadsheet Table Icon -->
      <path d="M 8 12 H 28 M 8 18 H 28 M 8 24 H 28 M 16 8 V 28 M 22 8 V 28" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <text x="48" y="16" class="badge-text">Spreadsheets</text>
      <text x="48" y="32" class="badge-subtext">Sheets • Excel • SQL</text>
    </g>
  </g>

  <!-- Node 2: Automation & Cron Scheduling -->
  <g class="node-2">
    <rect x="500" y="248" width="200" height="74" rx="14" fill="url(#cardGrad1)" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.7" />
    <g transform="translate(516, 267)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#4f46e5" fill-opacity="0.25" stroke="#818cf8" stroke-width="1" stroke-opacity="0.5" />
      <!-- Clock / Cron Schedule Icon -->
      <circle cx="18" cy="18" r="11" stroke="#818cf8" stroke-width="2" fill="none" />
      <polyline points="18,12 18,18 23,20" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="16" class="badge-text">Cron &amp; Schedule</text>
      <text x="48" y="32" class="badge-subtext">Recurring Automation</text>
    </g>
  </g>

  <!-- Node 3: Automated Email Reports -->
  <g class="node-3">
    <rect x="860" y="248" width="195" height="74" rx="14" fill="url(#cardGrad1)" stroke="#c084fc" stroke-width="1.5" stroke-opacity="0.7" />
    <g transform="translate(876, 267)">
      <rect x="0" y="0" width="36" height="36" rx="8" fill="#9333ea" fill-opacity="0.25" stroke="#c084fc" stroke-width="1" stroke-opacity="0.5" />
      <!-- Email Dispatch Icon -->
      <rect x="6" y="9" width="24" height="18" rx="3" stroke="#c084fc" stroke-width="2" fill="none" />
      <polyline points="7,11 18,19 29,11" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="48" y="16" class="badge-text">Email Reports</text>
      <text x="48" y="32" class="badge-subtext">Automated Delivery</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT HEADER (Always unobstructed in upper canvas) -->
  <g transform="translate(60, 52)">
    <!-- Category Pill Tag -->
    <rect x="0" y="0" width="180" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="13" cy="13" r="4.5" fill="#10b981" />
    <text x="26" y="17" class="pill-text">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="66" class="title">Awesome Email Spreadsheet On Schedule</text>

    <!-- Subtitle -->
    <text x="0" y="104" class="subtitle">Curated directory of SaaS platforms, automation engines &amp; open-source scheduled reporting tools</text>
  </g>

  <!-- Outer Frame Border -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#334155" stroke-width="1" stroke-opacity="0.6" />
</svg>
