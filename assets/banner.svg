<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.9" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 42px;
        fill: url(#primaryTextGrad);
        letter-spacing: -0.5px;
      }
      .subtitle {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .badge-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #e2e8f0;
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.7; transform: scale(1.04); }
      }
      @keyframes floatCard {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-7px); }
      }
      @keyframes dashMove {
        to { stroke-dashoffset: -40; }
      }
      @keyframes beamMove {
        0% { stroke-dashoffset: 200; opacity: 0.2; }
        50% { opacity: 0.9; }
        100% { stroke-dashoffset: -200; opacity: 0.2; }
      }
      .floating-node-1 {
        animation: floatCard 6s ease-in-out infinite;
        transform-origin: center;
      }
      .floating-node-2 {
        animation: floatCard 7s ease-in-out 1.5s infinite;
        transform-origin: center;
      }
      .floating-node-3 {
        animation: floatCard 5.5s ease-in-out 3s infinite;
        transform-origin: center;
      }
      .flow-path {
        stroke-dasharray: 8 6;
        animation: dashMove 3s linear infinite;
      }
      .glowing-orb {
        animation: pulseGlow 5s ease-in-out infinite;
        transform-origin: center;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Circuit / Tech Grid Pattern in Background -->
  <g opacity="0.08" stroke="#cbd5e1" stroke-width="1">
    <line x1="100" y1="0" x2="100" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="500" y1="0" x2="500" y2="360" />
    <line x1="700" y1="0" x2="700" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
  </g>

  <!-- Dynamic Animated Ambient Glow Orbs behind nodes -->
  <circle cx="240" cy="285" r="90" fill="#38bdf8" filter="url(#glow)" class="glowing-orb" opacity="0.2" />
  <circle cx="600" cy="285" r="90" fill="#818cf8" filter="url(#glow)" class="glowing-orb" opacity="0.2" />
  <circle cx="960" cy="285" r="90" fill="#c084fc" filter="url(#glow)" class="glowing-orb" opacity="0.2" />

  <!-- Connecting Animated Flow Beams -->
  <path d="M 330 285 L 500 285" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" class="flow-path" opacity="0.75" />
  <path d="M 700 285 L 860 285" stroke="#818cf8" stroke-width="3" stroke-linecap="round" class="flow-path" opacity="0.75" />

  <!-- Flow Direction Arrows -->
  <polygon points="508,285 496,280 496,290" fill="#38bdf8" opacity="0.85" />
  <polygon points="868,285 856,280 856,290" fill="#818cf8" opacity="0.85" />

  <!-- Dynamic Process Nodes (Bottom row, keeping top title crisp and unobstructed) -->
  
  <!-- Node 1: Data Sources & Sheets -->
  <g class="floating-node-1">
    <rect x="150" y="250" width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" stroke-opacity="0.6" />
    <g transform="translate(165, 266)">
      <!-- Spreadsheet Grid Icon -->
      <rect x="0" y="0" width="34" height="34" rx="6" fill="#0284c7" opacity="0.3" />
      <path d="M 7 11 H 27 M 7 17 H 27 M 7 23 H 27 M 15 7 V 27 M 21 7 V 27" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
      <text x="46" y="16" class="badge-text">Spreadsheets</text>
      <text x="46" y="31" font-family="sans-serif" font-size="11" fill="#94a3b8">Excel &bull; Sheets &bull; DB</text>
    </g>
  </g>

  <!-- Node 2: Scheduled Trigger & Automation Engine -->
  <g class="floating-node-2">
    <rect x="510" y="250" width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.5" filter="url(#glow)" stroke-opacity="0.6" />
    <g transform="translate(525, 266)">
      <!-- Clock / Cron Icon -->
      <rect x="0" y="0" width="34" height="34" rx="6" fill="#4f46e5" opacity="0.3" />
      <circle cx="17" cy="17" r="10" stroke="#818cf8" stroke-width="2" fill="none" />
      <polyline points="17,11 17,17 21,19" stroke="#818cf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="46" y="16" class="badge-text">Cron &amp; Schedule</text>
      <text x="46" y="31" font-family="sans-serif" font-size="11" fill="#94a3b8">Recurring Sync Engine</text>
    </g>
  </g>

  <!-- Node 3: Automated Email Delivery -->
  <g class="floating-node-3">
    <rect x="870" y="250" width="180" height="70" rx="12" fill="url(#cardGrad)" stroke="#c084fc" stroke-width="1.5" filter="url(#glow)" stroke-opacity="0.6" />
    <g transform="translate(885, 266)">
      <!-- Mail / Report Icon -->
      <rect x="0" y="0" width="34" height="34" rx="6" fill="#9333ea" opacity="0.3" />
      <rect x="5" y="8" width="24" height="18" rx="3" stroke="#c084fc" stroke-width="2" fill="none" />
      <polyline points="6,10 17,18 28,10" stroke="#c084fc" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
      <text x="46" y="16" class="badge-text">Email Reports</text>
      <text x="46" y="31" font-family="sans-serif" font-size="11" fill="#94a3b8">Scheduled Dispatch</text>
    </g>
  </g>

  <!-- FOREGROUND TEXT (Clearly visible, completely unobstructed) -->
  <g transform="translate(60, 95)">
    <!-- Header Tag Pill -->
    <rect x="0" y="0" width="220" height="28" rx="14" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <circle cx="14" cy="14" r="5" fill="#10b981" />
    <text x="27" y="19" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="12" font-weight="600" fill="#cbd5e1" letter-spacing="0.5px">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="66" class="title">Awesome Email Spreadsheet On Schedule</text>

    <!-- Subtitle -->
    <text x="0" y="104" class="subtitle">Curated directory of SaaS platforms, automation engines &amp; open-source scheduled reporting tools</text>
  </g>

  <!-- Outer Border Frame -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="16" fill="none" stroke="#334155" stroke-width="1" opacity="0.5" />
</svg>
